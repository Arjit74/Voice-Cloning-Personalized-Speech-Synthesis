services:
  - type: web
    name: voice-cloning-backend
    env: python
    pythonVersion: 3.10
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt && python download_models.py
    startCommand: |
      cd /opt/render/project/src && gunicorn backend.wsgi:app --timeout 120 --bind 0.0.0.0:10000
    envVars:
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
      - key: PYTHONPATH
        value: /opt/render/project/src
