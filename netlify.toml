[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_API_URL = "https://voice-cloning-backend.onrender.com"
  NODE_VERSION = "18.17.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8080
  targetPort = 8080

[[plugins]]
  package = "netlify-plugin-webpack-staticsites"
