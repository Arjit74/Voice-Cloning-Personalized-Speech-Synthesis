name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent free tier from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -f https://voice-cloning-backend.onrender.com/api/health || true
        continue-on-error: true
